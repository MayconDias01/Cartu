services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartu
      POSTGRES_PASSWORD: cartu
      POSTGRES_DB: cartu
    ports:
      - "5432:5432"
    volumes:
      - cartu_postgres_data:/var/lib/postgresql/data

volumes:
  cartu_postgres_data:
